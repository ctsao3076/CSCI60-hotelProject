{% extends 'base.html' %}
{% block container %}

<div class="container">
  <section class="formPage">
    <span class="eyebrow">Pardon the Interruption</span>
    <h1>Something went wrong</h1>
    <hr class="rule">
    <p class="muted">We hit an unexpected error while preparing this page:</p>
    <pre style="background: var(--cream); border: 1px solid var(--stone); padding: 18px; color: var(--rose); white-space: pre-wrap; font-family: 'Lato', monospace; font-size: 0.92em; margin-top: 12px;">{{ error }}</pre>
    <div style="margin-top: 22px;">
      <a class="btn" href="{{ url_for('home') }}">Return Home</a>
    </div>
  </section>
</div>

{% endblock %}
